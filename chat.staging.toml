# Botticelli Chat - Staging Configuration
# This configuration is for pre-production testing

[environment]
mode = "staging"

[database]
# PostgreSQL connection - staging database
url = "postgresql://botticelli:botticelli@staging-db:5432/botticelli_staging"
max_connections = 10
min_connections = 2
connection_timeout_seconds = 30

[mcp]
# MCP server connection - staging server
server_url = "http://mcp-staging:3001"
timeout_seconds = 90
max_retries = 4
retry_delay_ms = 1500

[llm]
# Use cheaper models for staging
default_provider = "gemini"
default_model = "gemini-1.5-flash"  # Fast and cheap for testing
rate_limit_tier = "standard"

[observability]
# Verbose logging for debugging staging issues
tracing_enabled = true
log_level = "debug"
jaeger_endpoint = "http://jaeger-staging:14268/api/traces"

[server]
host = "0.0.0.0"
port = 8080
enable_colors = true

[features]
# All features enabled to test before production
enable_bot_management = true
enable_social_scheduling = true
enable_narrative_validation = true

[testing]
# Staging-specific testing flags
enable_test_mode = true
mock_external_apis = false
verbose_errors = true
