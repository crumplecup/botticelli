[workspace]
members = [
  "crates/botticelli_chat",
  "crates/botticelli_error",
  "crates/botticelli_core",
  "crates/botticelli_interface",
  "crates/botticelli_rate_limit",
  "crates/botticelli_storage",
  "crates/botticelli_models",
  "crates/botticelli_database",
  "crates/botticelli_narrative",
  "crates/botticelli_social",
  "crates/botticelli_tui",
  "crates/botticelli",
  "crates/botticelli_server",
  "crates/botticelli_security",
  "crates/botticelli_cache",
  "crates/botticelli_actor",
  "crates/botticelli_bot",
  "crates/botticelli_mcp",
  "crates/botticelli_mcp_client",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Erik Rose <erik.w.rose@gmail.com>"]
repository = "https://github.com/crumplecup/botticelli"
keywords = ["llm", "chatbot", "ai", "nlp", "api"]
categories = ["api-bindings", "asynchronous", "ai"]

[workspace.dependencies]
# Internal crates (Phase 1 foundation)
botticelli_error = { path = "crates/botticelli_error", version = "0.2.0" }
botticelli_core = { path = "crates/botticelli_core", version = "0.2.0" }
botticelli_interface = { path = "crates/botticelli_interface", version = "0.2.0" }

# Observability (OpenTelemetry)
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = [
  "tokio",
  "metrics",
  "http-proto",
  "reqwest-client",
] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-stdout = { version = "0.31", features = ["trace", "metrics"] }
tracing-opentelemetry = "0.32"

# Internal crates (Phase 2 rate limiting)
botticelli_rate_limit = { path = "crates/botticelli_rate_limit", version = "0.2.0" }

# Internal crates (Phase 3 storage)
botticelli_storage = { path = "crates/botticelli_storage", version = "0.2.0" }

# Internal crates (Phase 4 models)
botticelli_models = { path = "crates/botticelli_models", version = "0.2.0" }

# Internal crates (Phase 3.5 database)
botticelli_database = { path = "crates/botticelli_database", version = "0.2.0" }

# Internal crates (Phase 5 narrative)
botticelli_narrative = { path = "crates/botticelli_narrative", version = "0.2.0" }

# Internal crates (Phase 6 social)
botticelli_social = { path = "crates/botticelli_social", version = "0.2.0" }

# Internal crates (Phase 6 tui)
botticelli_tui = { path = "crates/botticelli_tui", version = "0.2.0" }

# Internal crates (local model server)
botticelli_server = { path = "crates/botticelli_server", version = "0.2.0" }

# Internal crates (bot actors)
botticelli_bot = { path = "crates/botticelli_bot", version = "0.2.0" }

# Internal crates (Phase 6 security)
botticelli_security = { path = "crates/botticelli_security", version = "0.2.0" }

# Internal crates (Phase 6 cache)
botticelli_cache = { path = "crates/botticelli_cache", version = "0.2.0" }

# Internal crates (MCP integration)
botticelli_mcp = { path = "crates/botticelli_mcp", version = "0.2.0" }
botticelli_mcp_client = { path = "crates/botticelli_mcp_client", version = "0.2.0" }
botticelli_chat = { path = "crates/botticelli_chat", version = "0.2.0" }

# Internal crates (Phase 7 facade)
botticelli = { path = "crates/botticelli", version = "0.2.0", default-features = false }

# Common external dependencies (shared versions)
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
derive_more = { version = "2", features = ["display", "from", "from_str"] }
derive-new = "0.7"
derive-getters = "0.5"
derive_setters = "0.1"
derive_builder = "0.20"
paste = "1"
strum = { version = "0.27", features = ["derive"] }
petgraph = "0.8"
shellexpand = "3"

# Rate limiting and retry
governor = "0.10"
tokio-retry2 = { version = "0.9", features = ["jitter"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
regex = "1"
anyhow = "1"

# Actor system
ractor = { version = "0.15", features = ["async-trait"] }

# Configuration and HTTP
config = { version = "0.15", features = ["toml"] }
reqwest = { version = "0.13", features = ["json", "gzip", "stream", "rustls"] }
dirs = "6"

# Storage and hashing
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

# LLM provider SDKs
gemini-rust = "1.5"
ollama-rs = { version = "0.3", features = ["stream"] }
claude-client = "0.3"
hf-hub = "0.4.3"
huggingface_inference_rs = { version = "0.5.0", default-features = false }
tiktoken-rs = "0.9"
base64 = "0.22"

# WebSocket for live APIs
tokio-tungstenite = "0.28"

# Discord integration
serenity = { version = "0.12", default-features = false, features = [
  "client",
  "gateway",
  "rustls_backend",
  "model",
] }

# Database
diesel = { version = "2", features = [
  "postgres",
  "chrono",
  "uuid",
  "serde_json",
  "64-column-tables",
  "r2d2",
] }
diesel_migrations = "2"
r2d2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Environment variables
dotenvy = "0.15"

# Test and benchmark support
tempfile = "3"
mockall = "0.14"

# Elicitation framework
elicitation = { version = "0.4.7", features = [
  "serde_json",
  "chrono",
  "jiff",
  "regex",
  "time",
  "url",
  "uuid",
] }

# MCP (Model Context Protocol)
rmcp = { version = "0.14", default-features = false }
rmcp-macros = "0.14"
mcp-spec = "0.1.0"
schemars = { version = "1.0", features = ["uuid1"] }

# HTTP server and middleware
axum = "0.8"
tower = "0.5"
tower-http = "0.6"

# Tokio utilities
tokio-util = "0.7"

# Concurrent data structures
dashmap = "6.1"

# Test utilities
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
