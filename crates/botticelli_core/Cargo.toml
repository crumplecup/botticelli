[package]
name = "botticelli_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core data types for the Botticelli LLM API library"
keywords.workspace = true
categories.workspace = true

[features]
default = []
metrics = []
otel-otlp = []
models = ["dep:futures"]
anthropic = ["models", "dep:reqwest"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
derive_more = { workspace = true, features = ["display", "from", "error"] }
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_setters = { workspace = true }
derive_builder = { workspace = true }
async-trait = { workspace = true }
strum = { workspace = true }
chrono = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-stdout = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
botticelli_error = { workspace = true }
botticelli_interface = { workspace = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
tiktoken-rs = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dotenvy = { workspace = true }
