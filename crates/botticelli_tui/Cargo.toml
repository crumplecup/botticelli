[package]
name = "botticelli_tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Terminal UI for reviewing and managing Botticelli-generated content"

[dependencies]
# Error types
botticelli_error = { workspace = true, features = ["tui"] }

# Bot subsystems
botticelli_server = { workspace = true, features = ["mistral"] }
botticelli_bot = { workspace = true }
botticelli_core = { workspace = true }
botticelli_interface = { workspace = true }
botticelli_database = { workspace = true }
botticelli_mcp = { workspace = true }
botticelli_mcp_client = { workspace = true }
botticelli_models = { workspace = true, features = ["anthropic", "gemini", "ollama"] }
botticelli_rate_limit = { workspace = true }

# elicit_ui IR pipeline
elicit_ui.workspace = true
elicit_ratatui.workspace = true
elicitation = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# TUI libraries
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }

# Derives
async-trait = { workspace = true }
derive_more = { workspace = true }
derive-getters = { workspace = true }
unicode-width = { version = "0.2" }

# Narrative browsing and editing
botticelli_narrative = { workspace = true }
toml = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }

# CLI binary
clap = { workspace = true, features = ["env"] }
dotenvy = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "botticelli-tui"
