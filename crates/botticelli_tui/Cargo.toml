[package]
name = "botticelli_tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Terminal UI for reviewing and managing Botticelli-generated content"

[dependencies]
# Internal workspace crates
botticelli_error = { workspace = true, features = ["tui"] }
botticelli_database = { workspace = true, optional = true }
botticelli_narrative = { workspace = true }
botticelli_mcp = { workspace = true, features = ["streamable-http"], optional = true }
botticelli_mcp_client = { workspace = true }
botticelli_models = { workspace = true, features = ["anthropic"] }
botticelli_core = { workspace = true }
botticelli_interface = { workspace = true }

# MCP protocol
pmcp = "1.8.6"

# Database
diesel = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# TUI libraries
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }

# UUID
uuid = { workspace = true }

# System utilities
dirs = { workspace = true }

# Derives
derive-getters = { workspace = true }
derive_setters = { workspace = true }

# CLI dependencies
clap = { version = "4.5", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
botticelli_chat = { path = "../botticelli_chat", optional = true }

[features]
default = ["database"]
database = ["dep:botticelli_database", "dep:diesel", "botticelli_error/database"]
cli = ["dep:clap", "dep:dotenvy", "dep:reqwest", "dep:botticelli_chat", "dep:botticelli_mcp", "database"]

[[bin]]
name = "botticelli-tui"
required-features = ["cli"]
