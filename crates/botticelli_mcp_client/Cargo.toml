[package]
name = "botticelli_mcp_client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
botticelli_core.workspace = true
botticelli_database = { path = "../botticelli_database", version = "0.2.0", optional = true }
botticelli_error.workspace = true
botticelli_interface.workspace = true
botticelli_mcp = { path = "../botticelli_mcp", version = "0.2.0" }
botticelli_narrative = { path = "../botticelli_narrative", version = "0.2.0" }

async-trait.workspace = true
chrono.workspace = true
derive-getters.workspace = true
derive_more.workspace = true
glob = "0.3"
pmcp = { version = "1.8", features = ["validation"] }
prometheus = "0.13"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
typed-builder = "0.20"
