[package]
name = "botticelli_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Model Context Protocol (MCP) server for Botticelli"

[dependencies]
botticelli_core.workspace = true
botticelli_error.workspace = true
botticelli_interface.workspace = true
botticelli_narrative.workspace = true
botticelli_database = { workspace = true, optional = true }
botticelli_models = { workspace = true, optional = true }
botticelli_social = { workspace = true, optional = true, features = [
  "discord",
] }

# MCP SDK (pmcp + mcp-server kept during migration; removed in Phase 4)
pmcp = { version = "1.8", features = ["streamable-http", "http"] }
mcp-server = "0.1.0"
rmcp.workspace = true
schemars.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait.workspace = true

# Concurrent data structures
dashmap.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Error handling
derive_more = { workspace = true, features = ["display", "from"] }
derive_builder.workspace = true
derive-getters.workspace = true
derive-new.workspace = true
anyhow.workspace = true

# Tracing
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Environment
dotenvy.workspace = true

# Time
chrono.workspace = true

# UUID generation
uuid.workspace = true

# HTTP client (for HTTP transport and Discord tools)
reqwest = { workspace = true, features = ["json"] }

# HTTP server (for HTTP transport)
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["cors", "trace"], optional = true }
mcp-spec.workspace = true

# Elicitation framework
elicitation.workspace = true

# Database (only when feature enabled)
diesel = { workspace = true, features = ["postgres"], optional = true }

[dev-dependencies]
tokio-test.workspace = true
reqwest = { workspace = true, features = ["json"] }
futures.workspace = true

[features]
default = []

# HTTP transport (pmcp alias — replaced by rmcp transport in Phase 4)
streamable-http = ["pmcp/streamable-http"]

# Database integration
database = ["dep:botticelli_database", "dep:diesel"]

# Discord integration
discord = ["dep:botticelli_social"]

# HTTP server (old axum-based implementation)
http = ["dep:axum", "dep:tower", "dep:tower-http"]

# LLM backend features
gemini = ["dep:botticelli_models", "botticelli_models/gemini"]
anthropic = ["dep:botticelli_models", "botticelli_models/anthropic"]
ollama = ["dep:botticelli_models", "botticelli_models/ollama"]
huggingface = ["dep:botticelli_models", "botticelli_models/huggingface"]
groq = ["dep:botticelli_models", "botticelli_models/groq"]

# Combined LLM features
llm = ["gemini", "anthropic", "ollama", "huggingface", "groq"]
execution = ["llm"]                                            # Enable execution features

[[bin]]
name = "botticelli-mcp-http"
path = "src/bin/botticelli-mcp-http.rs"
required-features = ["http", "database", "llm"]

[[bin]]
name = "botticelli-mcp"
path = "src/bin/botticelli-mcp.rs"
required-features = ["database", "llm"]

[[bin]]
name = "botticelli-mcp-pmcp"
path = "src/bin/botticelli-mcp-pmcp.rs"
# No required features - works with any feature set

[[bin]]
name = "botticelli-mcp-pmcp-http"
path = "src/bin/botticelli-mcp-pmcp-http.rs"
# Placeholder for future HTTP support

[package.metadata.docs.rs]
all-features = true
