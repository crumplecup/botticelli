[package]
name = "botticelli_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Model Context Protocol (MCP) server for Botticelli"

[dependencies]
# MCP SDK - using official rmcp
rmcp = { version = "0.12.0", features = ["server"] }
rmcp-macros = "0.12.0"
schemars = "1.0"  # For JsonSchema derives (matches rmcp)

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Concurrent data structures
dashmap = "6.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
derive_more = { workspace = true, features = ["display", "from"] }
derive_builder = { workspace = true }
derive-getters = { workspace = true }
derive-new = { workspace = true }
anyhow = "1.0"

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Environment
dotenvy = { workspace = true }

# Time
chrono = "0.4"

# UUID generation
uuid = { workspace = true }

# HTTP client (for HTTP transport and Discord tools)
reqwest = { version = "0.12", features = ["json"] }

# HTTP server (for HTTP transport)
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }

# Internal dependencies
botticelli_core = { path = "../botticelli_core", version = "0.2.0" }
botticelli_error = { path = "../botticelli_error", version = "0.2.0" }
botticelli_interface = { path = "../botticelli_interface", version = "0.2.0" }
botticelli_narrative = { path = "../botticelli_narrative", version = "0.2.0" }
botticelli_database = { path = "../botticelli_database", version = "0.2.0", optional = true }
botticelli_models = { path = "../botticelli_models", version = "0.2.0", optional = true }
botticelli_social = { path = "../botticelli_social", version = "0.2.0", optional = true, features = ["discord"] }
mcp-spec = "0.1.0"

# Elicitation framework
elicitation = { workspace = true }

# Database (only when feature enabled)
diesel = { workspace = true, features = ["postgres"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"

[features]
default = []

# Legacy feature - kept for backward compatibility, no longer used
streamable-http = []

# Database integration
database = ["dep:botticelli_database", "dep:diesel"]

# Discord integration
discord = ["dep:botticelli_social"]

# HTTP server
http = ["dep:axum", "dep:tower", "dep:tower-http"]

# LLM backend features
gemini = ["dep:botticelli_models", "botticelli_models/gemini"]
anthropic = ["dep:botticelli_models", "botticelli_models/anthropic"]
ollama = ["dep:botticelli_models", "botticelli_models/ollama"]
huggingface = ["dep:botticelli_models", "botticelli_models/huggingface"]
groq = ["dep:botticelli_models", "botticelli_models/groq"]

# Combined LLM features
llm = ["gemini", "anthropic", "ollama", "huggingface", "groq"]
execution = ["llm"]  # Enable execution features

[[bin]]
name = "botticelli-mcp-http"
path = "src/bin/botticelli-mcp-http.rs"
required-features = ["http", "database", "llm"]

[[bin]]
name = "botticelli-mcp"
path = "src/bin/botticelli-mcp.rs"
required-features = ["database", "llm"]

[package.metadata.docs.rs]
all-features = true
