[package]
name = "botticelli_chat"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/botticelli"
description = "Chat interface for user/botticelli interaction"

[dependencies]
# Error handling
botticelli_error = { path = "../botticelli_error" }
derive_more = { version = "1.0", features = ["display", "error", "from"] }
derive-getters = "0.5"

# Internal dependencies
botticelli_models = { path = "../botticelli_models", features = ["gemini", "anthropic"] }
botticelli_mcp = { path = "../botticelli_mcp" }
botticelli_narrative = { path = "../botticelli_narrative" }
botticelli_core = { path = "../botticelli_core" }

# TUI (for binary with tui feature)
botticelli_tui = { path = "../botticelli_tui", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Configuration
config = { version = "0.14", default-features = false, features = ["toml"] }

# Tracing
tracing = "0.1"

# JSON
serde_json = "1.0"

# Builders
derive-new = "0.7"
derive_builder = "0.20"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async
async-trait = "0.1"
tokio = { version = "1.0", features = ["sync"] }

# File operations
walkdir = { version = "2.5", optional = true }
itertools = { version = "0.13", optional = true }

# TUI (optional)
ratatui = { workspace = true, optional = true }
crossterm = { version = "0.28", optional = true }
tui-tree-widget = { version = "0.23", optional = true }
tui-textarea = { version = "0.7", optional = true }
tui-logger = { version = "0.13", optional = true }
directories = { version = "5.0", optional = true }

# CLI (optional - for binary)
clap = { version = "4.5", features = ["derive", "env"], optional = true }

# Environment
dotenvy = { version = "0.15", optional = true }

# Database client (optional - for binary)
botticelli_database = { path = "../botticelli_database", optional = true }
diesel = { workspace = true, features = ["postgres"], optional = true }

# Storage (required for narrative repository)
botticelli_storage = { path = "../botticelli_storage", optional = true }

# Interface (for NarrativeRepository trait)
botticelli_interface = { path = "../botticelli_interface", optional = true }

# Rate limiting (for BotticelliDriver trait)
botticelli_rate_limit = { path = "../botticelli_rate_limit", optional = true }

# MCP client (optional - for binary)
botticelli_mcp_client = { path = "../botticelli_mcp_client", optional = true }

# HTTP client (for health checks)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Tracing subscriber (for binary)
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Actor (for demo mode)
botticelli_actor = { path = "../botticelli_actor", optional = true }

[features]
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:tui-tree-widget",
    "dep:tui-textarea",
    "dep:tui-logger",
    "dep:directories",
    "dep:walkdir",
    "dep:itertools",
]
cli = [
    "dep:clap",
    "dep:dotenvy",
    "dep:botticelli_database",
    "dep:botticelli_interface",
    "dep:botticelli_rate_limit",
    "dep:botticelli_storage",
    "dep:botticelli_mcp_client",
    "dep:diesel",
    "dep:reqwest",
    "dep:tracing-subscriber",
]
demo = ["cli", "dep:botticelli_actor"]
local = ["cli"]  # For local testing

[[bin]]
name = "botticelli-chat"
required-features = ["cli", "tui"]

[[bin]]
name = "demo"
required-features = ["cli", "demo"]

[dev-dependencies]
# Testing
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
botticelli_database = { path = "../botticelli_database" }
botticelli_interface = { path = "../botticelli_interface" }
botticelli_storage = { path = "../botticelli_storage" }
botticelli_mcp_client = { path = "../botticelli_mcp_client" }
diesel = { workspace = true, features = ["postgres"] }
color-eyre = "0.6"
