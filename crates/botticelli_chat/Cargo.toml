[package]
name = "botticelli_chat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chat interface for user/botticelli interaction"

[dependencies]
# Error handling
botticelli_error.workspace = true
derive_more.workspace = true
derive-getters.workspace = true
derive_setters.workspace = true

# Internal dependencies
botticelli_models = { path = "../botticelli_models", features = ["gemini", "anthropic", "groq"] }
botticelli_mcp = { path = "../botticelli_mcp" }
botticelli_narrative = { path = "../botticelli_narrative" }
botticelli_core = { path = "../botticelli_core" }

# Serialization
serde.workspace = true
toml.workspace = true

# Configuration
config = { version = "0.14", default-features = false, features = ["toml"] }

# Tracing
tracing = "0.1"

# JSON
serde_json.workspace = true

# Builders
derive-new.workspace = true
derive_builder.workspace = true

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async
async-trait.workspace = true
tokio.workspace = true

# CLI (optional - for binary)
clap = { version = "4.5", features = ["derive", "env"], optional = true }

# Environment
dotenvy = { version = "0.15", optional = true }

# Database client (optional - for binary)
botticelli_database = { path = "../botticelli_database", optional = true }
diesel = { workspace = true, features = ["postgres"], optional = true }

# Storage (required for narrative repository)
botticelli_storage = { path = "../botticelli_storage", optional = true }

# Interface (for NarrativeRepository trait)
botticelli_interface = { path = "../botticelli_interface", optional = true }

# Rate limiting (for BotticelliDriver trait)
botticelli_rate_limit = { path = "../botticelli_rate_limit", optional = true }

# MCP client
botticelli_mcp_client = { path = "../botticelli_mcp_client" }

# Elicitation framework
elicitation.workspace = true
pmcp = { version = "1.8", features = ["streamable-http"] }

# HTTP client (for health checks)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Tracing subscriber (for binary)
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Actor (for demo mode)
botticelli_actor = { path = "../botticelli_actor", optional = true }

[features]
cli = [
    "dep:clap",
    "dep:dotenvy",
    "dep:botticelli_database",
    "dep:botticelli_interface",
    "dep:botticelli_rate_limit",
    "dep:botticelli_storage",
    "dep:diesel",
    "dep:reqwest",
    "dep:tracing-subscriber",
]
demo = ["cli", "dep:botticelli_actor"]
local = ["cli"]  # For local testing
database = [
    "dep:botticelli_database",
    "dep:botticelli_interface",
    "dep:botticelli_storage",
    "dep:diesel",
]



[dev-dependencies]
# Testing
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
botticelli_database = { path = "../botticelli_database" }
botticelli_interface = { path = "../botticelli_interface" }
botticelli_storage = { path = "../botticelli_storage" }
diesel = { workspace = true, features = ["postgres"] }
color-eyre = "0.6"
