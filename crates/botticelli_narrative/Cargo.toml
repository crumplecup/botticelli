[package]
name = "botticelli_narrative"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Narrative execution engine for Botticelli"

[dependencies]
botticelli_error = { workspace = true, features = ["serde_json"] }
botticelli_core = { workspace = true }
botticelli_interface = { workspace = true }
botticelli_storage = { workspace = true }
rmcp = { workspace = true }
shellexpand = { workspace = true }

# Optional database support
botticelli_database = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
ractor = { workspace = true, optional = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
elicitation = { workspace = true }

# Logging
tracing = { workspace = true }
derive_builder.workspace = true
derive-getters.workspace = true
derive-new.workspace = true
botticelli_rate_limit = { workspace = true }
regex = { workspace = true }
derive_setters.workspace = true
petgraph = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[features]
default = ["database"]
database = ["dep:botticelli_database", "dep:diesel", "dep:chrono", "dep:ractor"]
api = []  # Marker feature for tests that make real API calls
gemini = []  # Marker feature for Gemini-specific tests

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
botticelli_models = { workspace = true, features = ["gemini"] }
dotenvy = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
