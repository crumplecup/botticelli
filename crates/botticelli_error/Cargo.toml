[package]
name = "botticelli_error"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Error types for the Botticelli LLM API library"
keywords.workspace = true
categories.workspace = true

[dependencies]
derive_more = { workspace = true, features = ["from", "display", "error"] }
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_builder = { workspace = true }
tracing = { workspace = true }
botticelli_interface = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
elicitation = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }

# Optional database error conversions
diesel = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }
toml = { workspace = true }
reqwest = { workspace = true, optional = true }
gemini-rust = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tiktoken-rs = { workspace = true, optional = true }
ollama-rs = { workspace = true, optional = true }
serenity = { workspace = true, optional = true }

[features]
default = []
database = ["dep:diesel", "dep:r2d2"]
reqwest = ["dep:reqwest"]
tui = []
models = ["dep:reqwest", "dep:gemini-rust", "dep:tokio-tungstenite", "dep:tiktoken-rs"]
ollama = ["models", "dep:ollama-rs"]
anthropic = ["models"]
huggingface = ["models"]
groq = ["models"]
discord = ["dep:serenity"]
