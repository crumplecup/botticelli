[package]
name = "botticelli_database"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Storage backends for Botticelli (redb default, PostgreSQL optional)"

[features]
default = ["redb"]
redb     = ["dep:elicit_redb", "dep:elicit_db"]
postgres = ["dep:elicit_sqlx", "dep:elicit_db", "dep:sqlx"]

[dependencies]
botticelli_interface.workspace = true

# Async
async-trait.workspace = true

# Backends (optional)
elicit_db   = { workspace = true, optional = true }
elicit_redb = { workspace = true, optional = true }
elicit_sqlx = { workspace = true, optional = true }
sqlx        = { workspace = true, optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
chrono.workspace = true

# Logging
tracing.workspace = true

# Derives
derive_more.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
