[package]
name = "botticelli_rate_limit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rate limiting and error recovery for the Botticelli LLM API library"
keywords.workspace = true
categories.workspace = true

[dependencies]
botticelli_core = { workspace = true }
botticelli_error = { workspace = true, features = ["reqwest"] }
botticelli_interface = { workspace = true }
tokio = { workspace = true }
governor = { workspace = true }
tokio-retry2 = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
strum = { workspace = true }
derive_more = { workspace = true }
derive-getters.workspace = true
derive_setters.workspace = true
derive_builder.workspace = true

[features]
default = []
gemini = []    # Marker feature for Gemini rate limiting
anthropic = [] # Marker feature for Anthropic rate limiting

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
tracing-subscriber = { workspace = true }
