[package]
name = "botticelli_social"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Social media platform integrations for Botticelli LLM framework"

[dependencies]
# Internal workspace crates
botticelli_error = { workspace = true }
botticelli_interface = { workspace = true }
botticelli_database = { workspace = true, optional = true }
botticelli_narrative = { workspace = true, optional = true }
botticelli_cache = { workspace = true }
botticelli_security = { workspace = true }
elicitation.workspace = true

# Database
diesel = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Derive macros
derive_more = { workspace = true }
derive-getters = { workspace = true }
derive_setters = { workspace = true }
derive_builder = { workspace = true }

# Discord integration (optional)
serenity = { workspace = true, optional = true }

[dev-dependencies]
dotenvy = { workspace = true }
tokio = { workspace = true, features = ["full"] }
botticelli_narrative = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
discord = ["serenity", "database", "botticelli_error/discord"]
database = ["dep:botticelli_database", "dep:botticelli_narrative", "dep:diesel", "dep:chrono"]
# Empty feature flag for marking expensive API integration tests
api = []

# Test configurations with required features
[[test]]
name = "bot_commands_test"
required-features = ["database"]

[[test]]
name = "secure_executor_test"
required-features = ["database"]

[[test]]
name = "discord_command_test"
required-features = ["discord"]

[[test]]
name = "discord_state_test"
required-features = ["discord"]

[[test]]
name = "discord_write_operations_test"
required-features = ["discord"]

[[test]]
name = "state_integration_test"
required-features = ["discord"]

