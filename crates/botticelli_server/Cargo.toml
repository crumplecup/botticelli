[package]
name = "botticelli_server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
botticelli_core.workspace = true
botticelli_error.workspace = true
botticelli_interface.workspace = true
botticelli_models = { workspace = true, optional = true }
botticelli_narrative.workspace = true
botticelli_rate_limit.workspace = true

# Backend: embedded mistral-rs inference (optional, enabled by "mistral" feature)
mistralrs = { workspace = true, optional = true }

anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
ractor.workspace = true
axum.workspace = true
derive-getters.workspace = true
derive_builder.workspace = true
derive-new.workspace = true

cron = { workspace = true }
elicitation = { workspace = true }

# Observability
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-stdout.workspace = true
tracing-opentelemetry.workspace = true

[dev-dependencies]

[features]
default = ["models"]
models  = ["botticelli_error/models"]
mistral = ["dep:mistralrs"]
ollama  = ["dep:botticelli_models", "botticelli_models/ollama"]
api     = []
metrics = []
