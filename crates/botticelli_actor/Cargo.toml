[package]
name = "botticelli_actor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.12"
derive-getters = { workspace = true }
derive_more = { workspace = true }
derive_setters = { workspace = true }
derive_builder = { workspace = true }
diesel = { workspace = true }
dotenvy = { workspace = true }
r2d2 = { workspace = true }
ractor = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

botticelli_core = { workspace = true }
botticelli_database = { workspace = true }
botticelli_error = { workspace = true }
botticelli_interface = { workspace = true }
botticelli_models = { workspace = true, features = ["gemini"] }
botticelli_narrative = { workspace = true, features = ["database"] }
botticelli_server = { workspace = true }
botticelli_social = { workspace = true, features = ["database", "discord"], optional = true }

# Optional main crate for observability
botticelli = { workspace = true, optional = true }

# Optional Discord platform support
serenity = { workspace = true, optional = true }
botticelli_mcp_client = { workspace = true }

[features]
default = []
discord = ["serenity", "botticelli_social"]
local = ["discord"]
observability = ["botticelli", "botticelli/observability"]
otel-otlp = ["observability", "botticelli/otel-otlp"]
metrics = ["botticelli_server/metrics"]

[[example]]
name = "discord_poster"
required-features = ["discord"]

[[example]]
name = "post_scheduler"
required-features = ["discord"]

[dev-dependencies]
dotenvy = { workspace = true }
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
tempfile = "3"
tracing-subscriber = "0.3"
uuid = { workspace = true, features = ["v4"] }
