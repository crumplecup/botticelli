[package]
name = "botticelli_security"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Security framework for safe agentic bot operations"
keywords.workspace = true
categories.workspace = true

[dependencies]
botticelli_error = { workspace = true }
elicitation.workspace = true
rmcp = { workspace = true }
schemars = { workspace = true }
derive_more = { workspace = true, features = ["display", "from", "deref", "deref_mut"] }
derive-getters = { workspace = true }
derive-new = { workspace = true }
derive_builder = { workspace = true }
derive_setters = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }

# Optional for database-backed approval workflows
diesel = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
dotenvy = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
database = ["dep:diesel", "botticelli_error/database"]
